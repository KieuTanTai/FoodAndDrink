name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # --- Fix: add direct package references to avoid NU1605 downgrade errors ---
      - name: Pin DI packages to 9.0.10 to avoid NU1605
        # Adjust path if your server project is in a different location
        run: |
          dotnet --version
          dotnet add ProjectShop.Server/ProjectShop.Server.csproj package Microsoft.Extensions.DependencyInjection --version 9.0.10
          dotnet add ProjectShop.Server/ProjectShop.Server.csproj package Microsoft.Extensions.DependencyInjection.Abstractions --version 9.0.10

      - name: Restore .NET projects
        run: dotnet restore ProjectShop.Server/ProjectShop.Server.csproj

      - name: Build
        run: dotnet build ProjectShop.Server/ProjectShop.Server.csproj -c Release --no-restore
        # If NU1605 still treated as errors in build, you can temporarily disable:
        # run: dotnet build ProjectShop.Server/ProjectShop.Server.csproj -c Release --no-restore -p:WarningsAsErrors=false

      # --- Node step: use npm install as fallback if no package-lock.json ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies (ci fallback to install)
        # If your frontend lives in a subfolder, set working-directory: <path/to/frontend>
        run: |
          npm ci || npm install

      # Add any test/publish steps below as needed
